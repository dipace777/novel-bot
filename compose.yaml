services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novelbot
      POSTGRES_PASSWORD: novelbot
      POSTGRES_DB: novelbot
    ports:
      - "127.0.0.1:6927:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelbot -d novelbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
