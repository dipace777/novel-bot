services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: novelbot
      POSTGRES_PASSWORD: novelbot
      POSTGRES_DB: novelbot
    ports:
      - "127.0.0.1:${COMPOSE_POSTGRES_PORT:-6927}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelbot -d novelbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${COMPOSE_REDIS_PORT:-6930}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://novelbot:novelbot@postgres:5432/novelbot?sslmode=disable
      DB_MAX_CONNS: 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      target: api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://novelbot:novelbot@postgres:5432/novelbot?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      REDIS_NAMESPACE: ${COMPOSE_REDIS_NAMESPACE:-novelbot-compose}
      AUTH_TIMEOUT: ${AUTH_TIMEOUT:-2s}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-30}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SESSION_TTL: ${SESSION_TTL:-24h}
      SESSION_STARTUP_TIMEOUT: ${SESSION_STARTUP_TIMEOUT:-10s}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "127.0.0.1:${COMPOSE_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, healthcheck, "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 10
    mem_limit: ${COMPOSE_API_MEMORY:-512m}
    memswap_limit: ${COMPOSE_API_MEMORY:-512m}
    cpus: ${COMPOSE_API_CPUS:-1}
    pids_limit: ${COMPOSE_API_PIDS_LIMIT:-128}
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    restart: unless-stopped

  worker-a:
    <<: &worker
      profiles: [app]
      build:
        context: .
        target: worker
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test: [CMD, healthcheck, --worker, "http://127.0.0.1:8090/readyz"]
        interval: 5s
        timeout: 4s
        retries: 10
      init: true
      cap_drop: [ALL]
      security_opt:
        - "no-new-privileges:true"
        - "seccomp=./deploy/chromium-seccomp.json"
      shm_size: 512mb
      mem_limit: ${COMPOSE_WORKER_MEMORY:-4g}
      memswap_limit: ${COMPOSE_WORKER_MEMORY:-4g}
      cpus: ${COMPOSE_WORKER_CPUS:-4}
      pids_limit: ${COMPOSE_WORKER_PIDS_LIMIT:-2048}
      stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-16m}
      restart: on-failure
    environment:
      <<: &worker-env
        REDIS_URL: redis://redis:6379/0
        REDIS_NAMESPACE: ${COMPOSE_REDIS_NAMESPACE:-novelbot-compose}
        WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:-}
        WORKER_HTTP_ADDR: :8090
        WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-15s}
        WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-15m}
        WORKER_STOP_GRACE_PERIOD: ${WORKER_STOP_GRACE_PERIOD:-16m}
        BROWSER_MAX_SESSIONS: ${COMPOSE_WORKER_MAX_SESSIONS:-6}
        # Container workers have no desktop display; use a native worker for headed testing.
        BROWSER_HEADLESS: "true"
        BROWSER_SESSION_TTL: ${BROWSER_SESSION_TTL:-15m}
        BROWSER_STARTUP_TIMEOUT: ${BROWSER_STARTUP_TIMEOUT:-10s}
        METRICS_SAMPLE_INTERVAL: ${METRICS_SAMPLE_INTERVAL:-5s}
      WORKER_ID: worker-a
      WORKER_URL: http://worker-a:8090
    ports:
      - "127.0.0.1:${COMPOSE_WORKER_A_PORT:-8090}:8090"

  worker-b:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-b
      WORKER_URL: http://worker-b:8090
    ports:
      - "127.0.0.1:${COMPOSE_WORKER_B_PORT:-8091}:8090"

volumes:
  postgres_data:
  redis_data:
