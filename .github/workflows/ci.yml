name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Source, contract, manifests, and generated SQL
        run: make check sqlc-check
      - name: Unit race tests, vet, and binary builds
        run: |
          mkdir -p test-results
          go test -race -json ./... > test-results/unit.jsonl
          make vet build
      - name: Required integration suite (isolated PostgreSQL and Redis)
        run: make test-integration
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Preserve test evidence and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Actual API, migrations, and two sandboxed Chromium workers
        run: make test-e2e
      - name: Vet browser test code
        run: go vet -tags=e2e ./tests/e2e
      - name: Preserve browser evidence and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: test-results/e2e/
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build identified images and archives from the clean tag
        run: python3 scripts/build-images.py --version "$VERSION" --prefix novelbot --output "release-artifacts/$VERSION"
      - name: Generate SBOMs and gate dependency/image vulnerabilities
        run: python3 scripts/scan-release.py "release-artifacts/$VERSION"
      - name: Preserve archives, image/browser identities, SBOMs, and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
